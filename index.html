<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A special Valentine's Day message for Maria">
    <meta name="theme-color" content="#ff4d6d">
    
    <!-- Preconnect to external resources for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>Will You Be My Valentine, Maria? 💖</title>
    
    <!-- Optimized font loading -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-pink: #ff4d6d;
            --secondary-pink: #ff8fa3;
            --soft-pink: #fff0f3;
            --accent-purple: #c9184a;
            --white: #ffffff;
            --light-gray: #eeeeee;
            --medium-gray: #666666;
        }

        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            transition: background 1s ease;
        }

        /* Accessibility: Skip to main content */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary-pink);
            color: var(--white);
            padding: 0.5rem 1rem;
            text-decoration: none;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }

        /* Floating Hearts Background */
        #floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart-bg {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            font-size: 1.25rem;
            user-select: none;
            z-index: 0;
            animation: float 5s linear infinite;
            cursor: pointer;
            pointer-events: auto;
        }

        @keyframes float {
            0% { 
                transform: translateY(100vh) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translateY(-6.25rem) rotate(360deg); 
                opacity: 0; 
            }
        }

        /* Main Container */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 1.5rem;
            border-radius: 1.875rem;
            box-shadow: 0 0.9375rem 2.1875rem rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 31.25rem;
            width: 100%;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            .container {
                padding: 2.5rem;
            }
        }

        /* Typography */
        h1 {
            font-family: 'Pacifico', cursive;
            color: var(--accent-purple);
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            margin-bottom: 1.5rem;
            text-shadow: 0.125rem 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
            line-height: 1.3;
        }

        h2 {
            font-family: 'Pacifico', cursive;
            color: var(--accent-purple);
            font-size: clamp(1.75rem, 6vw, 2.5rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        /* Media Container */
        .main-media {
            width: 11.25rem;
            height: 11.25rem;
            margin: 0 auto 1.5rem;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 0.5rem 1.25rem rgba(255, 77, 109, 0.2);
        }

        .main-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Button Container */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.9375rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        /* Button Styles */
        .btn {
            padding: 0.75rem 1.875rem;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 3.125rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 0.3125rem 0.9375rem rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .btn:focus {
            outline: 0.125rem solid var(--accent-purple);
            outline-offset: 0.125rem;
        }

        #yes-btn {
            background-color: var(--primary-pink);
            color: var(--white);
        }

        #yes-btn:hover,
        #yes-btn:focus {
            transform: scale(1.1);
            background-color: var(--accent-purple);
        }

        #no-btn {
            background-color: var(--light-gray);
            color: var(--medium-gray);
            transition: all 0.2s ease;
        }

        /* Celebration Screen */
        .celebration {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        .celebration.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(1.25rem); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .celebration-message {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: var(--primary-pink);
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .heartbeat {
            font-size: 4rem;
            animation: heartbeat 1.2s infinite ease-in-out;
            margin-top: 1rem;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 60%, 100% { 
                transform: scale(1); 
            }
            15% { 
                transform: scale(1.3); 
            }
            30% { 
                transform: scale(1); 
            }
            45% { 
                transform: scale(1.15); 
            }
        }

        /* Quote Display */
        #quote-container {
            margin-top: 1rem;
            font-style: italic;
            color: var(--accent-purple);
            min-height: 2.5em;
            transition: opacity 0.5s ease;
            font-weight: 500;
            padding: 0 1rem;
        }

        /* Secret Message */
        .secret-btn {
            background-color: var(--secondary-pink);
            color: var(--white);
            padding: 0.5rem 1.25rem;
            border-radius: 1.25rem;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            transition: background 0.3s;
            font-weight: 600;
        }

        .secret-btn:hover,
        .secret-btn:focus {
            background-color: var(--primary-pink);
        }

        .secret-btn:focus {
            outline: 0.125rem solid var(--accent-purple);
            outline-offset: 0.125rem;
        }

        #secret-message {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--soft-pink);
            border-radius: 0.9375rem;
            color: var(--accent-purple);
            font-weight: bold;
            animation: fadeIn 0.5s;
        }

        #secret-message.active {
            display: block;
        }

        /* Music Toggle */
        .music-toggle {
            background: var(--soft-pink);
            border: 0.125rem solid var(--primary-pink);
            border-radius: 50%;
            width: 3.125rem;
            height: 3.125rem;
            cursor: pointer;
            font-size: 1.5rem;
            margin: 0.5rem auto;
            color: var(--accent-purple);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0.25rem 0.625rem rgba(255, 77, 109, 0.2);
        }

        .music-toggle:hover,
        .music-toggle:focus {
            transform: scale(1.1);
        }

        .music-toggle:focus {
            outline: 0.125rem solid var(--accent-purple);
            outline-offset: 0.125rem;
        }

        /* Reset Button */
        #reset-btn {
            position: fixed;
            bottom: 0.625rem;
            right: 0.625rem;
            background: none;
            border: none;
            color: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 0.7rem;
            z-index: 10;
            padding: 0.5rem;
            font-family: 'Quicksand', sans-serif;
        }

        #reset-btn:hover,
        #reset-btn:focus {
            color: var(--primary-pink);
        }

        #reset-btn:focus {
            outline: 0.125rem solid var(--primary-pink);
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 0.625rem;
            height: 0.625rem;
            background-color: #f00;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Burst Effect */
        .burst {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: burstEffect 0.5s ease-out forwards;
        }

        @keyframes burstEffect {
            0% { 
                transform: scale(0.5); 
                opacity: 1; 
            }
            100% { 
                transform: scale(2.5); 
                opacity: 0; 
            }
        }

        /* Screen Reader Only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Loading State */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#main-container" class="skip-link">Skip to main content</a>

    <!-- Floating Hearts Background -->
    <div id="floating-hearts" aria-hidden="true"></div>

    <!-- Main Container -->
    <main class="container" id="main-container" role="main">
        <!-- Ask Screen -->
        <section id="ask-screen" aria-labelledby="ask-heading">
            <h1 id="ask-heading">Will you be my Valentine, Maria? 💖</h1>
            
            <div class="main-media" role="img" aria-label="Cute animated bear with hearts">
                <img 
                    src="./media/kisses.gif" 
                    alt="Animated teddy bear blowing kisses with hearts" 
                    id="main-gif"
                    loading="lazy"
                >
            </div>
            
            <div class="buttons" role="group" aria-label="Response options">
                <button 
                    id="yes-btn" 
                    class="btn" 
                    type="button"
                    aria-label="Yes, I will be your Valentine"
                >
                    YES! 💘
                </button>
                <button 
                    id="no-btn" 
                    class="btn" 
                    type="button"
                    aria-label="No, I won't be your Valentine"
                >
                    No...
                </button>
            </div>
        </section>

        <!-- Celebration Screen -->
        <section id="celebration-screen" class="celebration" aria-labelledby="celebration-heading">
            <h2 id="celebration-heading">Yaaaay! 🎉❤️</h2>
            
            <div class="main-media" role="img" aria-label="Happy bear celebrating">
                <img 
                    src="./media/kisses.gif" 
                    alt="Happy animated teddy bear celebrating with hearts" 
                    loading="lazy"
                >
            </div>
            
            <p class="celebration-message">I love you so much, Maria! 🥰</p>
            
            <div id="quote-container" role="status" aria-live="polite">
                "Every moment with you is a gift."
            </div>

            <button 
                class="secret-btn" 
                id="show-secret" 
                type="button"
                aria-expanded="false"
                aria-controls="secret-message"
            >
                A Secret for You... 🤫
            </button>
            
            <div 
                id="secret-message" 
                role="region" 
                aria-label="Secret message"
            >
                You're the best thing that ever happened to me! ❤️ 
				More Surprises tomorrow 😉
            </div>

            <button 
                id="music-toggle" 
                class="music-toggle" 
                type="button"
                aria-label="Toggle background music"
                aria-pressed="false"
            >
                <span aria-hidden="true">🔊</span>
                <span class="sr-only">Play music</span>
            </button>

            <div class="heartbeat" aria-hidden="true">❤️</div>
        </section>
    </main>

    <!-- Background Music -->
    <audio id="bg-music" loop aria-label="Background romantic music">
        <source src="./media/romantic.mp3" type="audio/mpeg">
        <p>Your browser does not support the audio element.</p>
    </audio>

    <!-- Reset Button -->
    <button id="reset-btn" type="button" aria-label="Reset page">Reset</button>

    <!-- JavaScript -->
    <script>
        // Cache DOM elements
        const elements = {
            yesBtn: document.getElementById('yes-btn'),
            noBtn: document.getElementById('no-btn'),
            askScreen: document.getElementById('ask-screen'),
            celebrationScreen: document.getElementById('celebration-screen'),
            floatingHearts: document.getElementById('floating-hearts'),
            quoteContainer: document.getElementById('quote-container'),
            secretBtn: document.getElementById('show-secret'),
            secretMsg: document.getElementById('secret-message'),
            resetBtn: document.getElementById('reset-btn'),
            bgMusic: document.getElementById('bg-music'),
            musicToggle: document.getElementById('music-toggle')
        };

        // Constants
        const NO_TEXTS = [
            "Are you sure?", "Really??", "Think again!", "Pwease? 🥺",
            "Don't do this...", "I'm gonna cry", "Breaking my heart!",
            "No way!", "Maybe yes?", "Try again!"
        ];

        const QUOTES = [
            "Every moment with you is a gift.",
            "You make my heart skip a beat.",
            "I'm so lucky to have you, Maria.",
            "You're the sparkle in my eye.",
            "Life is better with you by my side.",
            "You are my favorite person!",
            "I love you more than words can say."
        ];

        const HEART_CREATION_INTERVAL = 400;
        const HEART_LIFETIME = 5000;
        const QUOTE_CHANGE_INTERVAL = 4000;
        const QUOTE_TRANSITION_TIME = 500;
        const MAX_NO_CLICKS = 20;

        // State
        let state = {
            noCount: 0,
            yesScale: 1,
            quoteIndex: 0,
            quoteInterval: null,
            heartInterval: null
        };

        // Floating Hearts
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.animationDuration = `${Math.random() * 3 + 2}s`;
            heart.style.fontSize = `${Math.random() * 20 + 15}px`;
            
            heart.addEventListener('click', (e) => {
                e.stopPropagation();
                createBurst(e.clientX, e.clientY);
                heart.remove();
            });

            elements.floatingHearts.appendChild(heart);
            
            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
            }, HEART_LIFETIME);
        }

        function createBurst(x, y) {
            const burst = document.createElement('div');
            burst.classList.add('burst');
            burst.innerHTML = '💖';
            burst.style.left = `${x - 10}px`;
            burst.style.top = `${y - 10}px`;
            burst.style.fontSize = '30px';
            document.body.appendChild(burst);
            
            setTimeout(() => burst.remove(), 500);
        }

        function startHeartAnimation() {
            state.heartInterval = setInterval(createFloatingHeart, HEART_CREATION_INTERVAL);
        }

        // No Button Movement
        function moveNoButton() {
            if (state.noCount < MAX_NO_CLICKS) {
                const maxX = window.innerWidth - elements.noBtn.offsetWidth;
                const maxY = window.innerHeight - elements.noBtn.offsetHeight;
                
                const x = Math.random() * maxX;
                const y = Math.random() * maxY;
                
                elements.noBtn.style.position = 'fixed';
                elements.noBtn.style.left = `${x}px`;
                elements.noBtn.style.top = `${y}px`;
                elements.noBtn.style.zIndex = '1000';
                
                const textIndex = Math.min(state.noCount, NO_TEXTS.length - 1);
                elements.noBtn.textContent = NO_TEXTS[textIndex];
                
                state.yesScale += 0.25;
                elements.yesBtn.style.transform = `scale(${state.yesScale})`;
                
                state.noCount++;
            }
        }

        // Yes Button Handler
        function handleYesClick() {
            elements.askScreen.style.display = 'none';
            elements.celebrationScreen.classList.add('active');
            
            document.body.style.background = 'linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%)';
            
            createConfettiEffect();
            startQuotes();
            
            // Attempt to play music (may be blocked by browser)
            elements.bgMusic.play().catch(error => {
                console.log("Audio autoplay was blocked. User interaction required.");
            });
        }

        // Music Toggle
        function toggleMusic() {
            if (elements.bgMusic.paused) {
                elements.bgMusic.play();
                elements.musicToggle.innerHTML = '<span aria-hidden="true">🔊</span><span class="sr-only">Pause music</span>';
                elements.musicToggle.setAttribute('aria-pressed', 'true');
            } else {
                elements.bgMusic.pause();
                elements.musicToggle.innerHTML = '<span aria-hidden="true">🔇</span><span class="sr-only">Play music</span>';
                elements.musicToggle.setAttribute('aria-pressed', 'false');
            }
        }

        // Quote Rotation
        function startQuotes() {
            state.quoteInterval = setInterval(() => {
                elements.quoteContainer.style.opacity = '0';
                
                setTimeout(() => {
                    state.quoteIndex = (state.quoteIndex + 1) % QUOTES.length;
                    elements.quoteContainer.textContent = `"${QUOTES[state.quoteIndex]}"`;
                    elements.quoteContainer.style.opacity = '1';
                }, QUOTE_TRANSITION_TIME);
            }, QUOTE_CHANGE_INTERVAL);
        }

        // Secret Message Toggle
        function toggleSecret() {
            const isVisible = elements.secretMsg.classList.contains('active');
            
            if (isVisible) {
                elements.secretMsg.classList.remove('active');
                elements.secretBtn.textContent = "A Secret for You... 🤫";
                elements.secretBtn.setAttribute('aria-expanded', 'false');
            } else {
                elements.secretMsg.classList.add('active');
                elements.secretBtn.textContent = "Hide Secret";
                elements.secretBtn.setAttribute('aria-expanded', 'true');
            }
        }

        // Confetti Effect
        function createConfettiEffect() {
            const confettiCount = 100;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = `${Math.random() * 100}vw`;
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
                    
                    const size = Math.random() * 10 + 5;
                    confetti.style.width = `${size}px`;
                    confetti.style.height = `${size}px`;
                    
                    if (Math.random() > 0.5) {
                        confetti.innerHTML = '❤️';
                        confetti.style.background = 'none';
                        confetti.style.fontSize = '20px';
                    }
                    
                    document.body.appendChild(confetti);
                    
                    const animation = confetti.animate([
                        { 
                            transform: 'translateY(0) rotate(0)', 
                            opacity: 1 
                        },
                        { 
                            transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, 
                            opacity: 0 
                        }
                    ], { 
                        duration: Math.random() * 3000 + 2000, 
                        easing: 'cubic-bezier(0, .9, .6, 1)' 
                    });
                    
                    animation.onfinish = () => confetti.remove();
                }, i * 20);
            }
        }

        // Reset Function
        function resetPage() {
            location.reload();
        }

        // Event Listeners
        elements.noBtn.addEventListener('mouseover', moveNoButton);
        elements.noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        elements.yesBtn.addEventListener('click', handleYesClick);
        elements.musicToggle.addEventListener('click', toggleMusic);
        elements.secretBtn.addEventListener('click', toggleSecret);
        elements.resetBtn.addEventListener('click', resetPage);

        // Initialize
        startHeartAnimation();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (state.heartInterval) {
                clearInterval(state.heartInterval);
            }
            if (state.quoteInterval) {
                clearInterval(state.quoteInterval);
            }
        });
    </script>
</body>
</html>
